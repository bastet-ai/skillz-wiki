      - Andromeda Bytecode C2 Lab Workflow: skills/andromeda-bytecode-c2.md
      - ProjectDiscovery Internal Network Scanning: skills/projectdiscovery-internal-network-scanning.md
      - HTTP Probing with httpx: skills/httpx.md
      - DNS Enumeration: skills/dns-enumeration.md
      - Nmap Scanning: skills/nmap-scanning.md
  - Recon:
      - Overview: methodology/overview.md
      - Reconnaissance: methodology/reconnaissance.md
      - Large-Scale Reconnaissance: methodology/large-scale-reconnaissance.md
      - Weak Public-Key Recon: methodology/weak-public-key-recon.md
      - Client-Side Analysis: methodology/client-side-analysis.md
      - CSS Sanitizer and Host-UI Boundary Testing: methodology/css-sanitizer-host-boundary-testing.md
      - XSS Payload Hiding in HTML Tag Names (WAF Bypass): methodology/xss-tag-name-payload-hiding-waf-bypass.md
      - State Divergence Authorization Testing: methodology/state-divergence-authorization-testing.md
      - Google-style API Black-box Recon: methodology/google-api-black-box-recon.md
      - HTTP Anomaly and WebSocket Triage: methodology/http-anomaly-websocket-triage.md
      - HTTP Desync Research Campaigns: methodology/http-desync-research-campaigns.md
      - DNS Rebinding Local-Service Testing: methodology/dns-rebinding-local-service-testing.md
      - GitHub Actions Static Analysis: methodology/github-actions-static-analysis-recon.md
      - Agent Skill Supply Chain Testing: methodology/agent-skill-supply-chain-testing.md
      - Code-Editor Extension Webview and File-Write Boundary Testing: methodology/editor-extension-webview-file-write-boundary-testing.md
      - Agentic DAST Benchmark Validation: methodology/agentic-dast-benchmark-validation.md
      - Replayable Target Environment Design: methodology/target-environment-harness-design.md
      - Agent-guided Fuzzing Campaigns: methodology/agent-guided-fuzzing-campaigns.md
      - Agent-built Audit Tooling for Custom VMs: methodology/agent-built-audit-tooling-custom-vm.md
      - PyPI Account-Compromise Supply-Chain Testing: methodology/pypi-account-compromise-supply-chain-testing.md
